name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: ytmemchat
  NODE_OPTIONS: "--max-old-space-size=4096"
  # proxy.golang.org sometimes RST large zips over HTTP/2 (genproto on arm runners).
  GODEBUG: http2client=0
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            wails_platform: linux/amd64
            wails_tags: webkit2_41
            artifact: linux-amd64.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            wails_platform: linux/arm64
            wails_tags: webkit2_41
            artifact: linux-arm64.tar.gz
          - name: windows-amd64
            os: windows-latest
            wails_platform: windows/amd64
            artifact: windows-amd64.zip
          - name: darwin-universal
            os: macos-latest
            wails_platform: darwin/universal
            artifact: darwin-universal.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Wails project
        shell: bash
        run: |
          if [ ! -f wails.json ]; then
            echo "wails.json missing; scaffold the app before tagging a release."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev xvfb gcc pkg-config

      - name: Download Go modules
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt ${i}); retrying..."
            sleep $((i * 8))
          done
          exit 1

      - name: Install Wails CLI
        shell: bash
        run: |
          WAILS_VER="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          VERSION="$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short=12 HEAD)"
          # -skipbindings: committed frontend/wailsjs. Wails generate walks test
          # imports (gax-go.test → huge genproto zip) and also executes package
          # main (Linux hotkey init panics without DISPLAY).
          cmd=(wails build -skipbindings -clean -trimpath -platform "${{ matrix.wails_platform }}" -ldflags "-X github.com/HardDie/ytmemchat_wails/bindings/sidebar.buildVersion=${VERSION}")
          # Ubuntu 24.04 has webkit2gtk-4.1 only; Wails 2.11 still defaults to 4.0.
          if [ -n "${{ matrix.wails_tags }}" ]; then
            cmd+=(-tags "${{ matrix.wails_tags }}")
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a "${cmd[@]}"
          else
            "${cmd[@]}"
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          ARTIFACT="ytmemchat-${{ github.ref_name }}-${{ matrix.artifact }}"
          cd build/bin
          if [ "${{ runner.os }}" = "macOS" ]; then
            zip -r "../../dist/${ARTIFACT}" .
          else
            tar -czf "../../dist/${ARTIFACT}" .
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/bin/* -DestinationPath "dist/ytmemchat-${{ github.ref_name }}-${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/ytmemchat-${{ github.ref_name }}-${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
