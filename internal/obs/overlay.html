<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>OBS Media Overlay</title>
	<style>
	body {
		/* Set transparent background for OBS */
		background-color: rgba(0, 0, 0, 0);
		margin: 0;
		padding: 0;
		overflow: hidden;
		/* Hide scrollbars */
		width: 100vw;
		height: 100vh;
	}
	/* Container for Border, Shadow, Rotation, Position, and Scale */
	
	.alert-container {
		position: absolute;
		z-index: 1000;
		/* Visual styling for the "frame" */
		border: 15px solid #FFFFFF;
		/* White Border */
		border-radius: 20px;
		box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
		/* Drop shadow for depth */
		background-color: rgba(0, 0, 0, 0.7);
		/* IMPORTANT: No padding ensures media sits directly against the border */
		opacity: 0;
		/* Transition for fade-in/out and complex transform (rotation/scale) */
		transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
		/* Transformation origin must be center for correct scaling/rotation */
		transform-origin: center center;
	}
	/* The actual media element inside the container */
	
	.media-alert {
		display: block;
		max-width: 400px;
		/* Maximum base size for the media */
		max-height: 400px;
		object-fit: contain;
		/* Ensures media fills the container edge-to-edge (since padding is zero) */
		width: 100%;
		height: 100%;
	}

	.alert-container.audio-sticker {
		border: none;
		border-radius: 0;
		box-shadow: none;
		background: transparent;
	}

	.audio-sticker audio {
		position: absolute;
		width: 8px;
		height: 8px;
		opacity: 0.01;
		pointer-events: none;
	}

	.audio-sticker-rect {
		width: 0;
		height: 0;
		overflow: hidden;
		opacity: 0;
		border: none;
		background: transparent;
		pointer-events: none;
	}

	body.debug-audio .audio-sticker-rect {
		width: 80px;
		height: 80px;
		opacity: 1;
		background: rgba(50, 255, 80, 0.5);
		border: 2px solid #33ff66;
		box-sizing: border-box;
	}

    #connection-status {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 8px 15px;
        border-radius: 5px;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: bold;
        color: white;
        background-color: rgba(255, 0, 0, 0.7); /* Red for disconnected */
        display: none; /* Hidden by default when connected */
        z-index: 10001;
        pointer-events: none; /* Don't interfere with clicks */
    }

    #connection-status.app-closed {
        background-color: rgba(180, 110, 0, 0.85);
    }

    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
    }
	</style>
</head>

<body>
    <div id="connection-status">⚠️ WEB SOCKET DISCONNECTED - RETRYING...</div>

	<script>
	/* <====== Draw / playback ======> */
	let OBS_WIDTH = window.innerWidth;
	let OBS_HEIGHT = window.innerHeight;
	window.addEventListener('resize', function() {
		OBS_WIDTH = window.innerWidth;
		OBS_HEIGHT = window.innerHeight;
	});
	const MIN_STICKER_PLAYING_SEC = 5;
	const MEDIA_FADE_MS = 500;
	const debugParam = new URLSearchParams(window.location.search).get('debugAudio');
	if (debugParam === '1' || debugParam === 'true') {
		document.body.classList.add('debug-audio');
	}
	let alertQueue = [];
	let isPlaying = false;
	let currentTtsDrop = null;
	let ttsGeneration = 0;

	function addToQueue(data) {
		alertQueue.push(data);
		processQueue();
	}

	function processQueue() {
		if (isPlaying || alertQueue.length === 0) return;
		isPlaying = true;
		const nextAlert = alertQueue.shift();
		const volume = nextAlert.volume !== undefined ? nextAlert.volume : 0.8;
		displayTTS(nextAlert.payload, volume);
	}

	function onMediaFinished() {
		isPlaying = false;
		processQueue();
	}

	function stopCurrentTTSSource() {
		if (currentTtsDrop) {
			currentTtsDrop();
			currentTtsDrop = null;
		}
	}

	function bumpTTSGeneration() {
		ttsGeneration++;
	}

	function interruptCurrentTTS() {
		bumpTTSGeneration();
		stopCurrentTTSSource();
		isPlaying = false;
		processQueue();
	}

	function clearOverlayPlayback() {
		document.querySelectorAll('.alert-container').forEach(function(container) {
			container.querySelectorAll('video, audio').forEach(function(el) {
				try { el.pause(); } catch (e) { /* ignore */ }
				el.removeAttribute('src');
				try { el.load(); } catch (e) { /* ignore */ }
			});
			removeMediaElement(container);
		});
		document.querySelectorAll('body > audio').forEach(function(el) {
			try { el.pause(); } catch (e) { /* ignore */ }
			el.remove();
		});
		alertQueue = [];
		bumpTTSGeneration();
		stopCurrentTTSSource();
		isPlaying = false;
	}

	function placeAlertContainer(container, scale) {
		const originalWidth = container.offsetWidth;
		const originalHeight = container.offsetHeight;
		const scaledWidth = originalWidth * scale;
		const scaledHeight = originalHeight * scale;
		const randomRotation = (Math.random() * 20) - 10;
		container.style.transform = 'rotate(' + randomRotation + 'deg) scale(' + scale + ')';
		const safeXRange = OBS_WIDTH - scaledWidth;
		const safeYRange = OBS_HEIGHT - scaledHeight;
		const randomX = Math.random() * Math.max(0, safeXRange);
		const randomY = Math.random() * Math.max(0, safeYRange);
		const offsetX = (scaledWidth - originalWidth) / 2;
		const offsetY = (scaledHeight - originalHeight) / 2;
		container.style.left = (randomX - offsetX) + 'px';
		container.style.top = (randomY - offsetY) + 'px';
	}

	function startAudibleSticker(src, volume, opts) {
		opts = opts || {};
		const generation = opts.generation;
		const container = document.createElement('div');
		container.className = 'alert-container audio-sticker';
		const rect = document.createElement('div');
		rect.className = 'audio-sticker-rect';
		const audioElement = document.createElement('audio');
		audioElement.preload = 'auto';
		audioElement.volume = volume;
		container.appendChild(rect);
		container.appendChild(audioElement);
		document.body.appendChild(container);
		placeAlertContainer(container, 1);

		let faded = false;
		let ready = false;
		let started = false;
		let queueDone = false;
		let dropping = false;

		const finishQueue = function() {
			if (queueDone) return;
			queueDone = true;
			if (opts.onEnded) {
				opts.onEnded();
			}
		};

		const stale = function() {
			return generation !== undefined && generation !== ttsGeneration;
		};

		const drop = function() {
			if (dropping || container.dataset.removed) return;
			dropping = true;
			try { audioElement.pause(); } catch (e) { /* ignore */ }
			audioElement.removeAttribute('src');
			try { audioElement.load(); } catch (e) { /* ignore */ }
			if (opts.onDrop) {
				opts.onDrop();
			}
			removeMediaElement(container);
		};

		const tryPlay = function() {
			if (stale()) {
				drop();
				return;
			}
			if (!faded || !ready || started) return;
			started = true;
			if (opts.holdMin) {
				scheduleAudioTeardown(audioElement, drop);
			}
			const playAttempt = audioElement.play();
			if (playAttempt && playAttempt.catch) {
				playAttempt.catch(function(err) {
					console.error('Audio play blocked:', err);
					drop();
					if (!stale()) {
						finishQueue();
					}
				});
			}
		};

		audioElement.addEventListener('ended', function() {
			drop();
			finishQueue();
		});
		audioElement.addEventListener('error', function() {
			if (dropping) return;
			const skip = stale();
			drop();
			if (!skip) {
				finishQueue();
			}
		});
		audioElement.addEventListener('abort', function() {
			if (dropping) return;
			const skip = stale();
			drop();
			if (!skip) {
				finishQueue();
			}
		});
		audioElement.addEventListener('loadedmetadata', function() {
			ready = true;
			tryPlay();
		});
		audioElement.addEventListener('canplay', function() {
			ready = true;
			tryPlay();
		});
		setTimeout(function() {
			if (!ready) {
				drop();
				if (!stale()) {
					finishQueue();
				}
			}
		}, MIN_STICKER_PLAYING_SEC * 1000);
		audioElement.src = src;
		container.style.opacity = 1;
		setTimeout(function() {
			faded = true;
			tryPlay();
		}, MEDIA_FADE_MS);
		return drop;
	}

	function displayMediaAlert(filename, volume, scale) {
		const mediaUrl = '/obs/media/' + filename;
		const isVideo = filename.match(/\.(mp4|webm|mov)$/i);
		const isAudio = filename.match(/\.(mp3|ogg|wav|aac|flac)$/i);
		if (isAudio) {
			startAudibleSticker(mediaUrl, volume, { holdMin: true });
			return;
		}
		let mediaElement;
		const container = document.createElement('div');
		container.className = 'alert-container';
		if (isVideo) {
			mediaElement = document.createElement('video');
			mediaElement.autoplay = true;
			mediaElement.loop = false;
			mediaElement.muted = false;
			mediaElement.volume = volume;
			mediaElement.playsInline = true;
			mediaElement.preload = "metadata";
		} else {
			mediaElement = document.createElement('img');
		}
		mediaElement.className = 'media-alert';
		container.appendChild(mediaElement);
		document.body.appendChild(container);
		let laidOut = false;
		const failLoad = function() {
			removeMediaElement(container);
		};
		mediaElement.addEventListener('error', failLoad);
		mediaElement.addEventListener('abort', failLoad);
		setTimeout(function() {
			if (!laidOut) {
				removeMediaElement(container);
			}
		}, isVideo ? MIN_STICKER_PLAYING_SEC * 1000 : 6000);
		const handleMediaLoad = function() {
			if (laidOut) return;
			laidOut = true;
			mediaElement.removeEventListener('load', handleMediaLoad);
			mediaElement.removeEventListener('loadedmetadata', handleMediaLoad);
			placeAlertContainer(container, scale);
			container.style.opacity = 1;
			if (isVideo) {
				const playAttempt = mediaElement.play();
				if (playAttempt && playAttempt.catch) {
					playAttempt.catch(function() { /* autoplay blocked */ });
				}
				scheduleVideoTeardown(mediaElement, container);
			} else {
				setTimeout(function() {
					removeMediaElement(container);
				}, 6000);
			}
		};
		mediaElement.addEventListener('load', handleMediaLoad);
		mediaElement.addEventListener('loadedmetadata', handleMediaLoad);
		mediaElement.src = mediaUrl;
		if (mediaElement.complete || (mediaElement.readyState >= 1 && isVideo)) {
			handleMediaLoad();
		}
	}

	function displayTTS(payload, volume) {
		const generation = ttsGeneration;
		let objectUrl = '';
		try {
			const binaryString = atob(payload);
			const bytes = new Uint8Array(binaryString.length);
			for (let i = 0; i < binaryString.length; i++) {
				bytes[i] = binaryString.charCodeAt(i);
			}
			objectUrl = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
		} catch (err) {
			console.error('Error decoding TTS audio:', err);
			onMediaFinished();
			return;
		}
		currentTtsDrop = startAudibleSticker(objectUrl, volume, {
			generation: generation,
			holdMin: true,
			onDrop: function() {
				if (objectUrl) {
					URL.revokeObjectURL(objectUrl);
					objectUrl = '';
				}
				currentTtsDrop = null;
			},
			onEnded: function() {
				onMediaFinished();
			}
		});
	}

	function stickerHoldSec(mediaElement) {
		const d = mediaElement.duration;
		let sec = MIN_STICKER_PLAYING_SEC;
		if (Number.isFinite(d) && d > 0) {
			sec = Math.max(d, MIN_STICKER_PLAYING_SEC);
		}
		return sec;
	}

	function scheduleAudioTeardown(audioElement, drop) {
		/* TTS and command audio only. Full duration from play(); no early fade. */
		setTimeout(drop, stickerHoldSec(audioElement) * 1000);
	}

	function scheduleVideoTeardown(mediaElement, container) {
		/* Video stickers only. Visual fade starts 500ms before duration. */
		const fadeAt = Math.max(0, stickerHoldSec(mediaElement) * 1000 - MEDIA_FADE_MS);
		setTimeout(function() {
			removeMediaElement(container);
		}, fadeAt);
	}

	function removeMediaElement(container) {
		if (!container || container.dataset.removed) return;
		container.dataset.removed = '1';
		container.style.opacity = 0;
		setTimeout(function() {
			container.remove();
		}, MEDIA_FADE_MS);
	}
	</script>

	<script>
	/* <====== Messages ======> */
	function handleOverlayMessage(event) {
		let data;
		try {
			data = JSON.parse(event.data);
		} catch (e) {
			console.error("Error processing WebSocket message:", e);
			return;
		}
		const type = data.type;
		if (type === 'app_closed') {
			appClosed = true;
			clearOverlayPlayback();
			showConnectionStatus();
			return;
		}
		const filename = data.filename;
		const volume = data.volume !== undefined ? data.volume : 0.8;
		const scale = data.scale !== undefined ? data.scale : 1.0;
		if (type === 'alert') {
			displayMediaAlert(filename, volume, scale);
		} else if (type === 'tts') {
			addToQueue(data);
		} else if (type === 'tts_interrupt') {
			interruptCurrentTTS();
		}
	}

	var socketReadyLog = "WebSocket Connected! Ready for media alerts.";
	var handleSocketMessage = handleOverlayMessage;
	var onConnectionLost = clearOverlayPlayback;
	</script>
	<script src="/obs/script.js"></script>
</body>

</html>
