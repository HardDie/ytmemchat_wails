<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>OBS Media Overlay</title>
	<style>
	body {
		/* Set transparent background for OBS */
		background-color: rgba(0, 0, 0, 0);
		margin: 0;
		padding: 0;
		overflow: hidden;
		/* Hide scrollbars */
		width: 100vw;
		height: 100vh;
	}
	/* Container for Border, Shadow, Rotation, Position, and Scale */
	
	.alert-container {
		position: absolute;
		z-index: 1000;
		/* Visual styling for the "frame" */
		border: 15px solid #FFFFFF;
		/* White Border */
		border-radius: 20px;
		box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
		/* Drop shadow for depth */
		background-color: rgba(0, 0, 0, 0.7);
		/* IMPORTANT: No padding ensures media sits directly against the border */
		opacity: 0;
		/* Transition for fade-in/out and complex transform (rotation/scale) */
		transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
		/* Transformation origin must be center for correct scaling/rotation */
		transform-origin: center center;
	}
	/* The actual media element inside the container */
	
	.media-alert {
		display: block;
		max-width: 400px;
		/* Maximum base size for the media */
		max-height: 400px;
		object-fit: contain;
		/* Ensures media fills the container edge-to-edge (since padding is zero) */
		width: 100%;
		height: 100%;
	}

    #start-btn {
        /* Positioning logic */
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); /* Perfectly offsets the button's own width/height */
        z-index: 9999;

        /* Visual Styling */
        padding: 20px 40px;
        font-size: 24px;
        font-weight: bold;
        color: white;
        background: linear-gradient(135deg, #6e8efb, #a777e3);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
        z-index: 9999; /* Ensure it's above everything */
    }

    #start-btn:hover {
        transform: translate(-50%, -52%) scale(1.05);
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
        filter: brightness(1.1);
    }

    #start-btn:active {
        transform: translate(-50%, -48%) scale(0.95);
    }

    #connection-status {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 8px 15px;
        border-radius: 5px;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: bold;
        color: white;
        background-color: rgba(255, 0, 0, 0.7); /* Red for disconnected */
        display: none; /* Hidden by default when connected */
        z-index: 10001;
        pointer-events: none; /* Don't interfere with clicks */
    }

    #connection-status.app-closed {
        background-color: rgba(180, 110, 0, 0.85);
    }

    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
    }
	</style>
</head>

<body>
    <button id="start-btn">Enable Audio & Connect</button>
    <div id="connection-status">⚠️ WEB SOCKET DISCONNECTED - RETRYING...</div>

	<script>
	/* <====== Shared state ======> */
	var appClosed = false;
	var audioContext;
	</script>

	<script>
	/* <====== Draw / playback ======> */
	let OBS_WIDTH = window.innerWidth;
	let OBS_HEIGHT = window.innerHeight;
	window.addEventListener('resize', function() {
		OBS_WIDTH = window.innerWidth;
		OBS_HEIGHT = window.innerHeight;
	});
	const MIN_STICKER_PLAYING_SEC = 5;
	const MEDIA_FADE_MS = 500;
	let alertQueue = [];
	let isPlaying = false;
	let currentTtsSource = null;
	let ttsGeneration = 0;

	function addToQueue(data) {
		alertQueue.push(data);
		processQueue();
	}

	function processQueue() {
		if (isPlaying || alertQueue.length === 0) return;
		isPlaying = true;
		const nextAlert = alertQueue.shift();
		const volume = nextAlert.volume !== undefined ? nextAlert.volume : 0.8;
		displayTTS(nextAlert.payload, volume);
	}

	function onMediaFinished() {
		isPlaying = false;
		processQueue();
	}

	function stopCurrentTTSSource() {
		if (currentTtsSource) {
			try {
				currentTtsSource.stop();
			} catch (e) {
				/* already stopped */
			}
			currentTtsSource = null;
		}
	}

	function bumpTTSGeneration() {
		ttsGeneration++;
	}

	function interruptCurrentTTS() {
		bumpTTSGeneration();
		stopCurrentTTSSource();
		isPlaying = false;
		processQueue();
	}

	function clearOverlayPlayback() {
		document.querySelectorAll('.alert-container').forEach(function(container) {
			container.querySelectorAll('video, audio').forEach(function(el) {
				try { el.pause(); } catch (e) { /* ignore */ }
				el.removeAttribute('src');
				try { el.load(); } catch (e) { /* ignore */ }
			});
			removeMediaElement(container);
		});
		document.querySelectorAll('body > audio').forEach(function(el) {
			try { el.pause(); } catch (e) { /* ignore */ }
			el.remove();
		});
		alertQueue = [];
		bumpTTSGeneration();
		stopCurrentTTSSource();
		isPlaying = false;
	}

	function displayMediaAlert(filename, volume, scale) {
		const mediaUrl = '/obs/media/' + filename;
		const isVideo = filename.match(/\.(mp4|webm|mov)$/i);
		const isAudio = filename.match(/\.(mp3|ogg|wav|aac|flac)$/i);
		if (isAudio) {
			const audioElement = document.createElement('audio');
			audioElement.autoplay = true;
			audioElement.volume = volume;
			let audioReady = false;
			const drop = function() {
				if (audioElement.dataset.removed) return;
				audioElement.dataset.removed = '1';
				try { audioElement.pause(); } catch (e) { /* ignore */ }
				audioElement.removeAttribute('src');
				try { audioElement.load(); } catch (e) { /* ignore */ }
				audioElement.remove();
			};
			audioElement.addEventListener('ended', drop);
			audioElement.addEventListener('error', drop);
			audioElement.addEventListener('abort', drop);
			audioElement.addEventListener('loadedmetadata', function() {
				audioReady = true;
				scheduleAudioTeardown(audioElement, drop);
			});
			setTimeout(function() {
				if (!audioReady) {
					drop();
				}
			}, MIN_STICKER_PLAYING_SEC * 1000);
			audioElement.src = mediaUrl;
			document.body.appendChild(audioElement);
			return;
		}
		let mediaElement;
		const container = document.createElement('div');
		container.className = 'alert-container';
		if (isVideo) {
			mediaElement = document.createElement('video');
			mediaElement.autoplay = true;
			mediaElement.loop = false;
			mediaElement.muted = false;
			mediaElement.volume = volume;
			mediaElement.playsInline = true;
			mediaElement.preload = "metadata";
		} else {
			mediaElement = document.createElement('img');
		}
		mediaElement.className = 'media-alert';
		container.appendChild(mediaElement);
		document.body.appendChild(container);
		let laidOut = false;
		const failLoad = function() {
			removeMediaElement(container);
		};
		mediaElement.addEventListener('error', failLoad);
		mediaElement.addEventListener('abort', failLoad);
		setTimeout(function() {
			if (!laidOut) {
				removeMediaElement(container);
			}
		}, isVideo ? MIN_STICKER_PLAYING_SEC * 1000 : 6000);
		const handleMediaLoad = function() {
			if (laidOut) return;
			laidOut = true;
			mediaElement.removeEventListener('load', handleMediaLoad);
			mediaElement.removeEventListener('loadedmetadata', handleMediaLoad);
			const originalWidth = container.offsetWidth;
			const originalHeight = container.offsetHeight;
			const scaledWidth = originalWidth * scale;
			const scaledHeight = originalHeight * scale;
			const randomRotation = (Math.random() * 20) - 10;
			container.style.transform = 'rotate(' + randomRotation + 'deg) scale(' + scale + ')';
			const safeXRange = OBS_WIDTH - scaledWidth;
			const safeYRange = OBS_HEIGHT - scaledHeight;
			const randomX = Math.random() * Math.max(0, safeXRange);
			const randomY = Math.random() * Math.max(0, safeYRange);
			const offsetX = (scaledWidth - originalWidth) / 2;
			const offsetY = (scaledHeight - originalHeight) / 2;
			container.style.left = (randomX - offsetX) + 'px';
			container.style.top = (randomY - offsetY) + 'px';
			container.style.opacity = 1;
			if (isVideo) {
				const playAttempt = mediaElement.play();
				if (playAttempt && playAttempt.catch) {
					playAttempt.catch(function() { /* autoplay blocked */ });
				}
				scheduleVideoTeardown(mediaElement, container);
			} else {
				setTimeout(function() {
					removeMediaElement(container);
				}, 6000);
			}
		};
		mediaElement.addEventListener('load', handleMediaLoad);
		mediaElement.addEventListener('loadedmetadata', handleMediaLoad);
		mediaElement.src = mediaUrl;
		if (mediaElement.complete || (mediaElement.readyState >= 1 && isVideo)) {
			handleMediaLoad();
		}
	}

	function displayTTS(payload, volume) {
		if (!audioContext) {
			console.warn("AudioContext not initialized. Click the 'Start' button first.");
			onMediaFinished();
			return;
		}
		const generation = ttsGeneration;
		const binaryString = atob(payload);
		const len = binaryString.length;
		const bytes = new Uint8Array(len);
		for (let i = 0; i < len; i++) {
			bytes[i] = binaryString.charCodeAt(i);
		}
		audioContext.decodeAudioData(bytes.buffer)
			.then(function(audioBuffer) {
				if (generation !== ttsGeneration) {
					return;
				}
				const source = audioContext.createBufferSource();
				source.buffer = audioBuffer;
				currentTtsSource = source;
				const gainNode = audioContext.createGain();
				gainNode.gain.value = volume;
				source.connect(gainNode);
				gainNode.connect(audioContext.destination);
				source.onended = function() {
					source.disconnect();
					gainNode.disconnect();
					if (currentTtsSource !== source) {
						return;
					}
					currentTtsSource = null;
					onMediaFinished();
				};
				source.start(0);
			})
			.catch(function(err) {
				console.error("Error decoding TTS audio:", err);
				if (generation !== ttsGeneration) {
					return;
				}
				onMediaFinished();
			});
	}

	function stickerHoldSec(mediaElement) {
		const d = mediaElement.duration;
		let sec = MIN_STICKER_PLAYING_SEC;
		if (Number.isFinite(d) && d > 0) {
			sec = Math.max(d, MIN_STICKER_PLAYING_SEC);
		}
		return sec;
	}

	function scheduleAudioTeardown(audioElement, drop) {
		setTimeout(drop, stickerHoldSec(audioElement) * 1000);
	}

	function scheduleVideoTeardown(mediaElement, container) {
		const fadeAt = Math.max(0, stickerHoldSec(mediaElement) * 1000 - MEDIA_FADE_MS);
		setTimeout(function() {
			removeMediaElement(container);
		}, fadeAt);
	}

	function removeMediaElement(container) {
		if (!container || container.dataset.removed) return;
		container.dataset.removed = '1';
		container.style.opacity = 0;
		setTimeout(function() {
			container.remove();
		}, MEDIA_FADE_MS);
	}
	</script>

	<script>
	/* <====== Errors / recover ======> */
	const RECOVER_COOLDOWN_MS = 2000;
	let recovering = false;

	function recoverFromUnhandledError(label, detail) {
		console.error(label, detail);
		if (recovering) return;
		recovering = true;
		try {
			clearOverlayPlayback();
			connectWebSocket();
		} catch (e) {
			console.error(e);
		}
		setTimeout(function() { recovering = false; }, RECOVER_COOLDOWN_MS);
	}

	window.onerror = function(msg, url, line) {
		recoverFromUnhandledError("CRITICAL ERROR:", msg + " at " + line);
		return true;
	};

	window.onunhandledrejection = function(event) {
		event.preventDefault();
		recoverFromUnhandledError("PROMISE REJECTION:", event.reason);
	};
	</script>

	<script>
	/* <====== Messages ======> */
	function handleOverlayMessage(event) {
		let data;
		try {
			data = JSON.parse(event.data);
		} catch (e) {
			console.error("Error processing WebSocket message:", e);
			return;
		}
		const type = data.type;
		if (type === 'app_closed') {
			appClosed = true;
			clearOverlayPlayback();
			showConnectionStatus();
			return;
		}
		const filename = data.filename;
		const volume = data.volume !== undefined ? data.volume : 0.8;
		const scale = data.scale !== undefined ? data.scale : 1.0;
		if (type === 'alert') {
			displayMediaAlert(filename, volume, scale);
		} else if (type === 'tts') {
			addToQueue(data);
		} else if (type === 'tts_interrupt') {
			interruptCurrentTTS();
		}
	}
	</script>

	<script>
	/* <====== Connection ======> */
	const startBtn = document.getElementById('start-btn');
	const statusEl = document.getElementById('connection-status');
	const STATUS_LOST = '⚠️ WEB SOCKET DISCONNECTED - RETRYING...';
	const STATUS_CLOSED = 'ytmemchat is closed — reconnecting when it starts…';
	const RETRY_INTERVAL = 500;
	const CONNECTING_TIMEOUT_MS = 2500;
	let reconnectTimer = null;
	let connectingTimer = null;
	let websocket = null;
	const wsUri = ((window.location.protocol === 'https:') ? 'wss://' : 'ws://') + window.location.host + window.location.pathname.replace(/\/$/, '') + '/ws';

	function showConnectionStatus() {
		statusEl.textContent = appClosed ? STATUS_CLOSED : STATUS_LOST;
		statusEl.classList.toggle('app-closed', appClosed);
		statusEl.style.display = 'block';
	}

	function scheduleReconnect() {
		if (reconnectTimer) return;
		reconnectTimer = setTimeout(function() {
			reconnectTimer = null;
			connectWebSocket();
		}, RETRY_INTERVAL);
	}

	function clearConnectingTimer() {
		if (connectingTimer) {
			clearTimeout(connectingTimer);
			connectingTimer = null;
		}
	}

	function connectWebSocket() {
		if (reconnectTimer) {
			clearTimeout(reconnectTimer);
			reconnectTimer = null;
		}
		clearConnectingTimer();
		if (websocket) {
			console.log("Cleaning up old WebSocket before reconnecting...");
			websocket.onopen = null;
			websocket.onmessage = null;
			websocket.onerror = null;
			websocket.onclose = null;
			websocket.close();
			websocket = null;
		}
		websocket = new WebSocket(wsUri);
		const thisSocket = websocket;
		connectingTimer = setTimeout(function() {
			connectingTimer = null;
			if (websocket === thisSocket && thisSocket.readyState === WebSocket.CONNECTING) {
				thisSocket.close();
			}
		}, CONNECTING_TIMEOUT_MS);
		websocket.onopen = function() {
			clearConnectingTimer();
			console.log("WebSocket Connected! Ready for media alerts.");
			appClosed = false;
			statusEl.classList.remove('app-closed');
			statusEl.style.display = 'none';
		};
		websocket.onmessage = handleOverlayMessage;
		websocket.onclose = function() {
			clearConnectingTimer();
			websocket = null;
			clearOverlayPlayback();
			showConnectionStatus();
			console.log("Connection lost. Retrying in " + RETRY_INTERVAL + "ms...");
			scheduleReconnect();
		};
		websocket.onerror = function(err) {
			console.error("Socket encountered error: ", err);
			if (websocket) websocket.close();
		};
	}

	startBtn.addEventListener('click', async function() {
		if (!audioContext) {
			audioContext = new (window.AudioContext || window.webkitAudioContext)();
		}
		if (audioContext.state === 'suspended') {
			await audioContext.resume();
		}
		console.log('AudioContext is active:', audioContext.state);
		startBtn.style.display = 'none';
		connectWebSocket();
	});
	</script>
</body>

</html>
