<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>ytmemchat</title>
    <style>
        :root {
            --bg-color: #18181b;
            --text-color: #efeff1;
            --accent-color: #9147ff;
            --font-size: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            overflow: hidden;
        }

        body.transparent { background-color: transparent !important; }

        #chat-container {
            display: flex;
            /* Newest rows sit at the bottom (prepend + column-reverse). */
            flex-direction: column-reverse; 
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;

            /* HIDE SCROLLBAR LOGIC */
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;     /* Firefox */
        }

        /* HIDE SCROLLBAR LOGIC (Chrome/Safari) */
        #chat-container::-webkit-scrollbar {
            display: none;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            /* New row fades in at the bottom. */
            animation: slideDown 0.3s ease;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 6px;
            flex-shrink: 0;
            transition: opacity 0.2s ease-in;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 12px;
            border: 1px solid var(--accent-color);
        }

        .content {
            font-size: var(--font-size);

            /* This is the magic line */
            word-break: break-word;
            overflow-wrap: anywhere;

            /* Optional: helps with alignment if the message is very long */
            display: inline;
        }

        .author {
            font-weight: 700;
            color: var(--accent-color);
            margin-right: 8px;
        }

        .badge {
            font-size: 0.7em;
            padding: 2px 5px;
            border-radius: 4px;
            background: #e91916;
            margin-right: 5px;
            text-transform: uppercase;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #connection-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 15px;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background-color: rgba(255, 0, 0, 0.7); /* Red for disconnected */
            display: none; /* Hidden by default when connected */
            z-index: 10001;
            pointer-events: none; /* Don't interfere with clicks */
        }

        #connection-status.app-closed {
            background-color: rgba(180, 110, 0, 0.85);
        }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="connection-status">⚠️ WEB SOCKET DISCONNECTED - RETRYING...</div>

    <script>
    /* <====== Appearance ======> */
    const params = new URLSearchParams(window.location.search);
    if (params.get('fontSize')) {
        document.documentElement.style.setProperty('--font-size', params.get('fontSize'));
    }
    if (params.get('textColor')) {
        let textColor = params.get('textColor');
        if (textColor.charAt(0) !== '#') {
            textColor = '#' + textColor;
        }
        document.documentElement.style.setProperty('--text-color', textColor);
    }
    if (params.get('transparent') === '1' || params.get('transparent') === 'true') {
        document.body.classList.add('transparent');
    }
    </script>

    <script>
    /* <====== Draw ======> */
    function buildAvatarElement(msg) {
        const avatar = document.createElement('img');
        avatar.className = 'avatar';
        const fallback = function() {
            avatar.onerror = null;
            try {
                avatar.src = generateAvatar(msg.authorName || "?");
            } catch (e) {
                avatar.removeAttribute('src');
            }
        };
        avatar.onerror = fallback;
        if (msg.authorPicture && !msg.authorPicture.includes('placeholder')) {
            avatar.referrerPolicy = "no-referrer";
            avatar.src = msg.authorPicture;
        } else {
            fallback();
        }
        return avatar;
    }

    function buildContentElement(msg) {
        const content = document.createElement('div');
        content.className = 'content';
        if (msg.isOwner) content.innerHTML += '<span class="badge" style="background:#ffd700; color:black">Host</span>';
        if (msg.isModerator) content.innerHTML += '<span class="badge">Mod</span>';
        const authorSpan = document.createElement('span');
        authorSpan.className = 'author';
        authorSpan.textContent = msg.authorName + ": ";
        const textSpan = document.createElement('span');
        textSpan.className = 'text';
        textSpan.textContent = msg.messageText;
        content.appendChild(authorSpan);
        content.appendChild(textSpan);
        return content;
    }

    function generateAvatar(name) {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        if (!ctx) {
            return '';
        }
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const color = 'hsl(' + (hash % 360) + ', 60%, 45%)';
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 32px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const initial = name.charAt(0).toUpperCase();
        ctx.fillText(initial, canvas.width / 2, canvas.height / 2);
        return canvas.toDataURL();
    }
    </script>

    <script>
    /* <====== Messages ======> */
    function handleChatMessage(event) {
        let msg;
        try {
            msg = JSON.parse(event.data);
        } catch (e) {
            console.error("Error processing WebSocket message:", e);
            return;
        }
        if (msg.type === 'app_closed') {
            appClosed = true;
            showConnectionStatus();
            return;
        }
        if (msg.type === 'chat_flush') {
            document.getElementById('chat-container').replaceChildren();
            return;
        }
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = 'message-row';
        div.appendChild(buildAvatarElement(msg));
        div.appendChild(buildContentElement(msg));
        container.prepend(div);
        trimChatMessages();
    }

    const DEFAULT_CHAT_CAP = 100;

    function parseChatCap() {
        const raw = new URLSearchParams(window.location.search).get('cap');
        if (raw === null || raw === '') {
            return DEFAULT_CHAT_CAP;
        }
        const lower = String(raw).toLowerCase();
        if (lower === 'none' || lower === 'off' || lower === 'unlimited') {
            return 0;
        }
        const n = parseInt(raw, 10);
        if (n === 0) {
            return 0;
        }
        if (!Number.isFinite(n) || n < 1) {
            return DEFAULT_CHAT_CAP;
        }
        return n;
    }

    const chatCap = parseChatCap();

    function trimChatMessages() {
        if (chatCap <= 0) {
            return;
        }
        const container = document.getElementById('chat-container');
        while (container.children.length > chatCap) {
            container.lastElementChild.remove();
        }
    }

    var socketReadyLog = "WebSocket Connected! Ready for chat.";
    var handleSocketMessage = handleChatMessage;
    </script>
    <script src="/obs/script.js"></script>
</body>
</html>
